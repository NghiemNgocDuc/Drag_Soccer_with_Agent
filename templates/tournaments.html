<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournaments — Agent Soccer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='design-system.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
@import url('/static/vendor/fonts/be-vietnam.css"navbar">
  <a class="nav-brand" href="/play3d">Agent Soccer <span style="font-size:.65rem;color:#06b6d4;margin-left:6px">3D</span></a>
  <div class="nav-links">
    <a href="/play3d" class="nav-link">Play</a>
    <a href="/playground" class="nav-link">Playground</a>
    <a href="/arena" class="nav-link">Arena</a>
    <a href="/tournaments" class="nav-link active">Tournaments</a>
    <a href="/research" class="nav-link">Research</a>
    <a href="/leaderboard" class="nav-link">Leaderboard</a>
    <a href="/achievements" class="nav-link">Achievements</a>
    <a href="/profile" class="nav-link">Profile</a>
    <a href="/customize" class="nav-link">Customize</a>
    <span class="nav-user">{{ username }}</span>
    <a href="/auth/logout" class="nav-link" style="color:#ef4444;margin-left:8px">Logout</a>
  </div>
</nav>

<main style="max-width:1100px;margin:0 auto;padding:28px 16px">
  <div class="page-hero">
    <div>
      <h1>Tournaments</h1>
      <p>Compete in brackets • Invite friends or AIs • Watch replays</p>
    </div>
    <button class="btn btn-primary" onclick="createTournament()" style="padding:12px 22px;font-size:.95rem">+ New Tournament</button>
  </div>

  {% if tournaments %}
  <div class="tourney-grid">
    {% for t in tournaments %}
    <div class="glass-card tourney-card">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
        <h3>{{ t.name }}</h3>
        <span class="badge {% if t.status == 'active' %}badge-active{% elif t.status == 'completed' %}badge-completed{% else %}badge-pending{% endif %}">{{ t.status }}</span>
      </div>
      <div class="tourney-meta">
        <span> {{ t.participants|length if t.participants is defined else '—' }} players</span>
        <span> {{ t.created_at[:10] if t.created_at else '' }}</span>
      </div>
      <a href="/tournaments/{{ t.id }}" class="btn btn-primary btn-sm" style="width:100%">View Bracket →</a>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="glass-card empty-state">
    <div class="ico"></div>
    <h3 style="margin:0 0 6px;color:#0f172a">No tournaments yet</h3>
    <p style="margin:0 0 14px">Be the first to create one and invite your squad!</p>
    <button class="btn btn-primary" onclick="createTournament()">Create Tournament</button>
  </div>
  {% endif %}
</main>

<script>
function createTournament() {
  const name = prompt("Enter tournament name:");
  if(!name) return;
  fetch('/tournaments/create', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name })
  }).then(res => res.json()).then(data => {
    if(window.AW) AW.handle(data);
    if(data.ok) window.location.href = '/tournaments/' + data.tournament.id;
    else alert(data.error || 'Failed to create');
  });
}
</script>
<script src="/static/achievements.js"></script>
<script src="/static/feedback.js"></script>
</body>
</html>
