<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Agent Soccer</title>
<link href="/static/vendor/fonts/be-vietnam.css" rel="stylesheet">
<link rel="stylesheet" href="/static/design-system.css">
<link rel="stylesheet" href="/static/style.css">
<style>
body {
  margin: 0; padding: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 15%, #fecaca 30%, #fbcfe8 50%, #c7d2fe 70%, #bfdbfe 85%, #a7f3d0 100%);
  background-size: 400% 400%;
  animation: bg-flow 20s ease infinite;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Be Vietnam Pro', system-ui, sans-serif;
}
.card {
  position: relative; z-index: 1;
  background: var(--glass-bg);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  box-shadow: 0 24px 60px rgba(80,120,200,.12), inset 0 1px 0 rgba(255,255,255,.95);
  padding: 36px 32px;
  width: 100%; max-width: 400px; margin: 24px;
}
h2 { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 8px; text-align: center; }
.sub { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 22px; }
.field { margin-bottom: 15px; }
label { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
input[type="password"] {
  width: 100%; padding: 10px 13px;
  background: rgba(255,255,255,.7);
  border: 1px solid var(--glass-border);
  border-radius: 9px;
  font-family: inherit; font-size: .88rem; color: var(--text);
  transition: border-color .15s, background .15s;
}
input:focus { outline: none; border-color: rgba(6,182,212,.6); background: rgba(255,255,255,.9); }
.btn-submit {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, #06b6d4, #8b5cf6);
  color: #fff;
  font-family: inherit; font-size: .95rem; font-weight: 700;
  border: none; border-radius: 9px; cursor: pointer; margin-top: 10px;
  box-shadow: 0 4px 16px rgba(6,182,212,.35);
  transition: transform .15s, box-shadow .15s, opacity .15s;
}
.btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,182,212,.5); }
.btn-submit:disabled { opacity: .55; cursor: not-allowed; }
.message {
  font-size: .8rem; padding: 11px 14px; border-radius: 8px; margin-bottom: 16px; line-height: 1.5; display: none;
}
.message.ok { display: block; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.35); color: var(--green); }
.message.err { display: block; background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35); color: var(--red); }
.hint { font-size: .7rem; color: var(--dim); margin: -8px 0 14px; }
.footer { text-align: center; margin-top: 20px; font-size: .8rem; color: var(--muted); }
.footer a { color: #06b6d4; text-decoration: none; font-weight: 600; }
.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <h2>Set a new password</h2>
  <p class="sub">Choose a new password for your account.</p>

  <div class="message" id="msg"></div>

  <div id="expired-wrap" style="display:none">
    <div class="message err" id="expired-msg">This reset link is invalid or has expired.</div>
    <div class="footer"><a href="/forgot-password">Request a new reset link</a></div>
  </div>

  <div id="form-wrap">
    <form id="reset-form" novalidate>
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" required>
        <div class="hint">At least 6 characters.</div>
      </div>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <input type="password" id="confirm" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Update Password</button>
    </form>
  </div>

  <div id="done-wrap" style="display:none">
    <div class="message ok">Password updated. You can now sign in with your new password.</div>
    <div class="footer"><a href="/login">Go to sign in</a></div>
  </div>
</div>

<script>
(function () {
  const msg = document.getElementById('msg');
  function showMsg(text, ok) {
    msg.textContent = text;
    msg.className = 'message ' + (ok ? 'ok' : 'err');
  }

  const hash = (window.location.hash || '').substring(1);
  const params = {};
  hash.split('&').forEach(function (kv) {
    const i = kv.indexOf('=');
    if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });

  const at = params.access_token || '';
  const rt = params.refresh_token || '';

  if (!at || !rt) {
    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('expired-wrap').style.display = 'block';
    return;
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm  = document.getElementById('confirm').value;
    if (password.length < 6) { showMsg('Password must be at least 6 characters.', false); return; }
    if (password !== confirm) { showMsg('Passwords do not match.', false); return; }
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    showMsg('Updating…', true);
    try {
      const r = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: at, refresh_token: rt, password }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok) {
        document.getElementById('form-wrap').style.display = 'none';
        document.getElementById('done-wrap').style.display = 'block';
        window.location.hash = '';
      } else {
        showMsg(data.error || 'Could not update the password. Try again.', false);
        btn.disabled = false;
      }
    } catch (err) {
      showMsg('Network error — could not update the password.', false);
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
