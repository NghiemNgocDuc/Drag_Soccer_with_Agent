<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Agent Soccer</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
body {
  margin: 0; padding: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, #fef3c7 0%, #fde68a 15%, #fecaca 30%, #fbcfe8 50%, #c7d2fe 70%, #bfdbfe 85%, #a7f3d0 100%);
  background-size: 400% 400%;
  animation: bg-flow 20s ease infinite;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Be Vietnam Pro', system-ui, sans-serif;
}
.card {
  position: relative; z-index: 1;
  background: var(--glass-bg);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  box-shadow: 0 24px 60px rgba(80,120,200,.12), inset 0 1px 0 rgba(255,255,255,.95);
  padding: 36px 32px;
  width: 100%; max-width: 400px; margin: 24px;
}
h2 { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 8px; text-align: center; }
.sub { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 22px; }
.field { margin-bottom: 15px; }
label { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
input[type="email"] {
  width: 100%; padding: 10px 13px;
  background: rgba(255,255,255,.7);
  border: 1px solid var(--glass-border);
  border-radius: 9px;
  font-family: inherit; font-size: .88rem; color: var(--text);
  transition: border-color .15s, background .15s;
}
input:focus { outline: none; border-color: rgba(6,182,212,.6); background: rgba(255,255,255,.9); }
.btn-submit {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, #06b6d4, #8b5cf6);
  color: #fff;
  font-family: inherit; font-size: .95rem; font-weight: 700;
  border: none; border-radius: 9px; cursor: pointer; margin-top: 10px;
  box-shadow: 0 4px 16px rgba(6,182,212,.35);
  transition: transform .15s, box-shadow .15s, opacity .15s;
}
.btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,182,212,.5); }
.btn-submit:disabled { opacity: .55; cursor: not-allowed; }
.message {
  font-size: .8rem; padding: 11px 14px; border-radius: 8px; margin-bottom: 16px; line-height: 1.5; display: none;
}
.message.ok { display: block; background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.35); color: var(--green); }
.message.err { display: block; background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35); color: var(--red); }
.footer { text-align: center; margin-top: 20px; font-size: .8rem; color: var(--muted); }
.footer a { color: #06b6d4; text-decoration: none; font-weight: 600; }
.footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">
  <h2>Reset your password</h2>
  <p class="sub">Enter your account email and we'll send you a reset link.</p>

  <div class="message" id="msg"></div>

  <div id="form-wrap">
    <form id="reset-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Send Reset Link</button>
    </form>
  </div>

  <div id="sent-wrap" style="display:none">
    <div class="message ok" id="sent-msg">If an account exists for that address, a password reset link is on its way. Check your inbox (and spam folder).</div>
    <div class="footer"><a href="/login">Back to sign in</a></div>
  </div>

  <div class="footer" id="back-footer">
    Remembered it? <a href="/login">Sign in</a>
  </div>
</div>

<script>
function showMsg(el, text, ok) {
  el.textContent = text;
  el.className = 'message ' + (ok ? 'ok' : 'err');
}

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const btn = document.getElementById('submit-btn');
  const msg = document.getElementById('msg');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    showMsg(msg, 'Enter a valid email address.', false);
    return;
  }
  btn.disabled = true;
  showMsg(msg, 'Sending…', true);
  try {
    const r = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) {
      document.getElementById('form-wrap').style.display = 'none';
      document.getElementById('back-footer').style.display = 'none';
      document.getElementById('sent-wrap').style.display = 'block';
    } else {
      showMsg(msg, data.error || 'Could not send the reset email. Try again.', false);
      btn.disabled = false;
    }
  } catch (err) {
    showMsg(msg, 'Network error — could not send the reset email. Try again.', false);
    btn.disabled = false;
  }
});
</script>
</body>
</html>
